<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordly</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Wordly</h1>
    <button id="theme-btn" aria-label="Change theme">Dark mode</button>
  </header>

  <main>
    <form id="search-form">
      <input type="text" id="word-input" placeholder="Search a word" aria-label="Word to search">
      <button type="submit" aria-label="Search">Search</button>
    </form>

    <p id="message"></p>

    <section id="results" aria-label="Search results"></section>

    <section aria-label="Saved words">
      <h2>Saved words</h2>
      <ul id="saved-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
